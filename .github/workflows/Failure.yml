name: Job failure workflow
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: lint
        run: echo "linting the project..."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: exit 1  # This step will fail  

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: deploy
        run: echo "Deploying the project..."