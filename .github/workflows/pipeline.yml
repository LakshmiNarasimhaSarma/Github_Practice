name: pipeline
on: 
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: test
              run: echo "Testing the project..."
    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Build
              run: echo "Building the project..."
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy
              run: echo "Deploying the project..."